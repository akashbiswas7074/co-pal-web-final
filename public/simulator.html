<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone 15 Pro Simulator - Peeds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1e1e24 0%, #0d0d11 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #f5f5f7;
      overflow-x: hidden;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      padding: 10px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .device-title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #0071e3;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button.control-btn, a.control-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button.control-btn:hover, a.control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }
    button.control-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .cloud-btn {
      background: linear-gradient(135deg, #0071e3, #47a3ff) !important;
      border: none !important;
      color: #fff !important;
      font-weight: 600 !important;
    }
    .tunnel-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tunnel-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      user-select: all;
    }
    .tunnel-chip code {
      color: #30d158;
      font-family: monospace;
      font-size: 11px;
    }
    /* iPhone 15 Pro Chassis */
    .iphone-case {
      position: relative;
      width: 393px;
      height: 852px;
      background: #1c1c1e;
      border-radius: 54px;
      box-shadow: 
        0 0 0 4px #424245,
        0 0 0 10px #1a1a1a,
        0 25px 60px -15px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(0, 113, 227, 0.15);
      overflow: hidden;
      border: 4px solid #000;
    }
    /* Screen Viewport */
    .iphone-screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 48px;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 99999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    .island-camera {
      width: 11px;
      height: 11px;
      background: radial-gradient(circle at 30% 30%, #1a237e 0%, #000 70%);
      border-radius: 50%;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4);
    }
    .island-sensor {
      width: 8px;
      height: 8px;
      background: #0a0a0a;
      border-radius: 50%;
    }
    /* iOS Status Bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      color: #000;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    /* Home Indicator Bar */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 10px;
      z-index: 99999;
      pointer-events: none;
      box-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <div class="device-title">
      <span> iPhone 15 Pro Simulator</span>
      <span class="badge">iOS 17</span>
    </div>
    <div class="btn-group">
      <button class="control-btn active" id="btn-customer" onclick="setSite('/')">Store (3000)</button>
      <button class="control-btn" id="btn-admin" onclick="setSite('http://localhost:3001')">Admin (3001)</button>
      <button class="control-btn" onclick="reloadFrame()">↻ Reload</button>
      <a class="control-btn cloud-btn" href="https://appetize.io/demo" target="_blank" title="Launch Real Apple iOS Device in Cloud">☁️ Appetize Cloud iOS</a>
    </div>
  </div>

  <div class="tunnel-bar">
    <span>🌐 <strong>Public Live Tunnel:</strong></span>
    <span class="tunnel-chip" onclick="copyText('https://ee5111c51757f1.lhr.life')" title="Click to copy">
      <code id="tunnel-url">https://ee5111c51757f1.lhr.life</code>
      📋
    </span>
    <span>•</span>
    <span>📱 <strong>Local Wi-Fi IP:</strong></span>
    <span class="tunnel-chip" onclick="copyText('http://192.168.29.159:3000')" title="Click to copy">
      <code>http://192.168.29.159:3000</code>
      📋
    </span>
    <span id="copy-toast" style="display:none; color:#30d158; font-weight:600; font-size:11px;">Copied!</span>
  </div>

  <div class="iphone-case">
    <!-- Dynamic Island -->
    <div class="dynamic-island">
      <div class="island-sensor"></div>
      <div class="island-camera"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="current-time">9:41</span>
      <div class="status-icons">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
          <path d="M1 9h2v3H1V9zm4-3h2v6H5V6zm4-3h2v9H9V3zm4-3h2v12h-2V0z"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor">
          <path d="M7.5 2.5C9.8 2.5 11.9 3.5 13.3 5.1L14.7 3.7C12.9 1.7 10.3 0.5 7.5 0.5C4.7 0.5 2.1 1.7 0.3 3.7L1.7 5.1C3.1 3.5 5.2 2.5 7.5 2.5zM7.5 6C8.9 6 10.2 6.6 11.1 7.6L12.5 6.2C11.2 4.9 9.4 4 7.5 4C5.6 4 3.8 4.9 2.5 6.2L3.9 7.6C4.8 6.6 6.1 6 7.5 6zm0 3.5C6.7 9.5 6 10.2 6 11h3c0-.8-.7-1.5-1.5-1.5z"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 25 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor"/>
          <rect x="2" y="2" width="16" height="8" rx="2"/>
          <path d="M23 4v4c.8 0 1.5-.7 1.5-1.5v-1c0-.8-.7-1.5-1.5-1.5z"/>
        </svg>
      </div>
    </div>

    <!-- Screen Content -->
    <div class="iphone-screen">
      <iframe id="app-frame" src="/" title="App Preview"></iframe>
    </div>

    <!-- Home Swipe Indicator -->
    <div class="home-indicator"></div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      let hours = now.getHours();
      let minutes = now.getMinutes();
      minutes = minutes < 10 ? '0' + minutes : minutes;
      document.getElementById('current-time').textContent = hours + ':' + minutes;
    }
    updateTime();
    setInterval(updateTime, 10000);

    function setSite(url) {
      document.getElementById('app-frame').src = url;
      document.getElementById('btn-customer').classList.toggle('active', url === '/');
      document.getElementById('btn-admin').classList.toggle('active', url.includes('3001'));
    }

    function reloadFrame() {
      const f = document.getElementById('app-frame');
      f.src = f.src;
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copy-toast');
        if (toast) {
          toast.style.display = 'inline';
          setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }
      });
    }

    // Touch Swipe Emulation: Allows dragging with mouse inside the iPhone screen
    const frame = document.getElementById('app-frame');
    function attachTouchDrag() {
      try {
        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        if (!doc) return;

        let isDown = false;
        let startY = 0;
        let scrollStart = 0;
        let hasMoved = false;

        doc.addEventListener('mousedown', (e) => {
          isDown = true;
          hasMoved = false;
          startY = e.clientY;
          scrollStart = win.scrollY || doc.documentElement.scrollTop || doc.body.scrollTop;
        });

        doc.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          const diff = e.clientY - startY;
          if (Math.abs(diff) > 4) {
            hasMoved = true;
            win.scrollTo({ top: scrollStart - diff, behavior: 'auto' });
          }
        });

        const stopDrag = () => { isDown = false; };
        doc.addEventListener('mouseup', stopDrag);
        doc.addEventListener('mouseleave', stopDrag);
      } catch (e) {
        // Cross-origin fallback
      }
    }
    frame.addEventListener('load', attachTouchDrag);
    attachTouchDrag();
  </script>
</body>
</html>
